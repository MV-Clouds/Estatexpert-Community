<template>
    <template if:true={showToast}>
        <template if:true={successToast}>
            <div class="slds-notify_container">
                <div class="slds-notify slds-notify_toast slds-theme_success" style="width: 95%; max-width: 30rem; min-width: auto" role="status">
                    <span class="slds-assistive-text">Success</span>
                    <span class="slds-icon_container slds-icon-utility-success slds-m-right_small slds-no-flex slds-align-top">
                        <lightning-icon icon-name="utility:success" variant="inverse" size="small"></lightning-icon>
                    </span>
                    <div class="slds-notify__content">
                        <h2 class="slds-text-heading_small">
                            <p> {message} </p>
                        </h2>
                    </div>
                    <div class="slds-notify__close">
                        <lightning-button-icon icon-name="utility:close" size="small" variant="border-filled" onclick={closeToastModel} ></lightning-button-icon>
                    </div>
                </div>
            </div>
        </template>

        <template if:false={successToast}>
            <div class="slds-notify_container">
                <div class="slds-notify slds-notify_toast slds-theme_error" style="width: 95%; max-width: 30rem; min-width: auto" role="status">
                    <span class="slds-assistive-text">Error</span>
                    <span class="slds-icon_container slds-icon-utility-error slds-m-right_small slds-no-flex slds-align-top">
                        <lightning-icon icon-name="utility:error" variant="inverse" size="small"></lightning-icon>
                    </span>
                    <div class="slds-notify__content">
                        <h2 class="slds-text-heading_small">
                            <p> {message} </p>
                        </h2>
                    </div>
                    <div class="slds-notify__close">
                        <lightning-button-icon icon-name="utility:close" size="small" variant="border-filled" onclick={closeToastModel} ></lightning-button-icon>
                    </div>
                </div>
            </div>
        </template>
    </template>
</template>
