<template>
    <div class="main-div">
        <img src={bgImage} alt="BgImage" class="bg-image"/>
        <div class="header">
            <div class="header-text">Favourite Property</div>
        </div>
        <div class="fav-propertirs">
            <template if:true={isDataAvailable}>
                <template for:each={favProperties} for:item="property">
                    <c-esx_-favourite-properties-card key={property.Id} property={property} onrefreshdata={refreshView}></c-esx_-favourite-properties-card>
                </template>
            </template>
            <template if:false={isDataAvailable}>
                <div class="empty-state">You haven't liked any properties yet!</div>
            </template>
        </div>
    </div>
</template>
