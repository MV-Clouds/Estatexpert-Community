<template>
    <div class="main-div">
        <div class="backgroundImage">
            <img src={BgImage} alt="Background Image" />
        </div>
        <div class="overlay" lwc:dom="manual"></div>
        <div class="delete-confirmation">
            <template if:true={isModalOpen}>
                <div class="delete_popup">
                    <div class="close-icon">
                        <lightning-icon icon-name="utility:close" alternative-text="Utility image" title="close"
                            size="small" onclick={closePopup}></lightning-icon>
                    </div>
                    <div class="delete-icon"><img src={deleteIcon}></img></div>
                    <div class="delete-title">Delete</div>
                    <div class="delete-msg">Are you sure to delete this inqury?</div>
                    <div class="two-buttons">
                        <button class="btn slds-m-right_small" onclick={cancelAction}>No</button>
                        <button class="btn slds-m-left_small" onclick={deleteInquiryRecord}>Yes</button>
                    </div>
                </div>
            </template>
        </div>
        <div class="container">
            <h1 class="title">Buyer Information</h1>
            <br />
            <div class="buttons">
                <lightning-button variant={allBtnVarient} label="All" title="All"
                    onclick={handleFilter}></lightning-button>
                <lightning-button variant={buyBtnVarient} label="Buy" title="Buy" onclick={handleFilter}
                    class="slds-m-left_x-small"></lightning-button>
                <lightning-button variant={rentBtnVarient} label="Rent" title="Rent" onclick={handleFilter}
                    class="slds-m-left_x-small"></lightning-button>
            </div>
            <br />
            <div class="table">
                <template if:true={isData}>
                    <table aria-labelledby="element-with-table-label other-element-with-table-label">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="No.">No.</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="Property Name">Property Name</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="Buyer Name">Buyer Name</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="Mobile No.">Mobile No.</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="Email Id">Email ID</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="Inquiry Date">Inquiry Date</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="Status">Status</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate rowValue" title="Action">Action</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={FilteredData} for:item="item">
                                <tr class="slds-hint-parent" key={item.Id}>
                                    <td data-label="Thumbnail">
                                        <div class="slds-truncate rowValue" title="Number">{item.number}</div>
                                    </td>
                                    <td data-label="Title">
                                        <div class="box">
                                            <div class="slds-truncate imgbox" title="Thumbnail"><img src={item.ImageURL}
                                                    class="slds-avatar slds-avatar_rectangle slds-avatar_large customimg"
                                                    alt="Thumbnail" /></div>
                                            <div class="slds-truncate rowValue propTitle" title="Property Name">
                                                {item.Listing__r.Property__r.Name}</div>
                                        </div>
                                    </td>
                                    <td data-label="buyer_name">
                                        <div class="box">
                                            <lightning-avatar size="medium" variant="circle" class="avatar"
                                                src={item.profileUrl}></lightning-avatar>
                                            <div class="slds-truncate rowValue" title="buyer name">
                                                {item.Contact__r.Name}</div>
                                        </div>

                                    </td>
                                    <td data-label="mobile">
                                        <div class="slds-truncate rowValue" title="mobile phone">
                                            {item.Contact__r.MobilePhone}</div>

                                    </td>
                                    <td data-label="email">
                                        <div class="slds-truncate rowValue emailDiv" title="email">
                                            {item.Contact__r.Email}</div>

                                    </td>
                                    <td data-label="date">
                                        <div class="slds-truncate rowValue" title="date">{item.Inquiry_Date__c}</div>

                                    </td>
                                    <td data-label="dropdown">
                                        <div class="slds-truncate rowValue dropdown" title="status">
                                            <template if:false={item.isEdit}>
                                                <div class="slds-truncate rowValue" title="date">{item.Status__c}</div>
                                            </template>
                                            <template if:true={item.isEdit}>
                                                <lightning-select name="status" value={item.Status__c} options={options}
                                                    class="statusDropdown" onchange={handleStatusChange}
                                                    data-key={item.Id}></lightning-select>
                                            </template>
                                        </div>
                                    </td>
                                    <td data-label="actions">
                                        <div class="slds-truncate rowValue" title="actions">
                                            <template if:true={item.isEdit}>
                                                <lightning-button icon-name="utility:save" alternative-text="Save"
                                                    class=" save-button my-round-button" title="Save" data-key={item.Id}
                                                    data-status={item.Status__c} data-url={item.ImageURL}
                                                    onclick={saveUpdatedStatus} disabled></lightning-button>
                                            </template>
                                            <template if:false={item.isEdit}>
                                                <lightning-button icon-name="utility:edit" alternative-text="Edit"
                                                    class="slds-m-left_x-small my-round-button" title="Edit"
                                                    data-key={item.Id} data-status={item.Status__c}
                                                    data-url={item.ImageURL} onclick={editStatus}></lightning-button>
                                            </template>
                                            <lightning-button icon-name="utility:delete" alternative-text="Delete"
                                                class=" slds-m-left_x-small my-round-button" title="Delete"
                                                data-key={item.Id} data-url={item.ImageURL}
                                                onclick={delete_row}></lightning-button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={isData}>
                    <div class="message">
                        <h1>No inquiries found for the current user.</h1>
                    </div>
                </template>
            </div>

            <!-- Mobile-View for inquiry page -->
            <div class="card-view">
                <template for:each={FilteredData} for:item="item">
                    <div class="card" key={item.Id}>
                        <div class="property-image">
                            <div class="img-box">
                                <div class="slds-truncate imgbox" title="Thumbnail"><img src={item.ImageURL}
                                        class="slds-avatar slds-avatar_rectangle slds-avatar_large customimg"
                                        alt="Thumbnail" /></div>
                            </div>
                            <div class="name-box">
                                <div class="slds-truncate rowValue propTitle" title="Property Name">
                                    <b>{item.Listing__r.Property__r.Name}</b>
                                </div>
                                <div class="slds-truncate rowValue " title="Property Name">{item.Contact__r.Name}</div>
                            </div>
                        </div>
                        <div class="information">
                            <div class="lines">
                                <div class="slds-truncate rowValue card-value" title="Property Name">Status</div>
                                <template if:false={item.isEdit}>
                                    <div class="slds-truncate rowValue" title="date">{item.Status__c}</div>
                                </template>
                                <template if:true={item.isEdit}>
                                    <lightning-select name="status" value={item.Status__c} options={options}
                                        class="statusDropdown" onchange={handleStatusChange}
                                        data-key={item.Id}></lightning-select>
                                </template>
                            </div>
                            <div class="lines">
                                <div class="slds-truncate rowValue card-value" title="Property Name">Mobile No.</div>
                                <div class="slds-truncate rowValue" title="Property Name">{item.Contact__r.MobilePhone}
                                </div>
                            </div>
                            <div class="lines">
                                <div class="slds-truncate rowValue card-value" title="Property Name">E-mail</div>
                                <div class="slds-truncate rowValue" title="Property Name">{item.Contact__r.Email}</div>
                            </div>
                            <div class="lines">
                                <div class="slds-truncate rowValue card-value" title="Property Name">Inquiry date</div>
                                <div class="slds-truncate rowValue" title="Property Name">{item.Inquiry_Date__c}</div>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <div class="slds-truncate rowValue actions-buttons" title="actions">
                                <template if:true={item.isEdit}>
                                    <lightning-button icon-name="utility:save" alternative-text="Save"
                                        class=" save-button my-round-button" title="Save" data-key={item.Id}
                                        data-status={item.Status__c} data-url={item.ImageURL}
                                        onclick={saveUpdatedStatus} disabled></lightning-button>
                                </template>
                                <template if:false={item.isEdit}>
                                    <lightning-button icon-name="utility:edit" alternative-text="Edit"
                                        class="slds-m-left_x-small my-round-button" title="Edit" data-key={item.Id}
                                        data-status={item.Status__c} data-url={item.ImageURL}
                                        onclick={editStatus}></lightning-button>
                                </template>
                                <lightning-button icon-name="utility:delete" alternative-text="Delete"
                                    class=" slds-m-left_x-small my-round-button" title="Delete" data-key={item.Id}
                                    data-url={item.ImageURL} onclick={delete_row}></lightning-button>
                            </div>
                        </div>
                    </div>
                    <br key={item.Id} />
                    <br key={item.Id} />
                </template>
            </div>
        </div>
    </div>
</template>
