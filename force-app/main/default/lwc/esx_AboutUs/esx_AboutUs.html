<template>
    <div class="about-header">
        <img class="header-img" src={aboutUsImgUrl} alt="about_us_image">
        <h1 class="centered-text">About Us</h1>
    </div>


    <div class="container">
        <h1>Who We Are?</h1>
        <div class="content">
            <div class="text-content">
                <p>MV Clouds is a highly professional development studio for Salesforce, offering Cloud & Salesforce
                    outsourcing services to the different small and large businesses as well as IT vendors globally.
                    Headquartered in Ahmedabad, we offer some of the best solutions that suit the business requirements
                    posed by the client, enabling them to meet their end goals. With our evolving practices, and domain
                    expertise, we have reached out to several companies across geographies. We have scaled our business
                    owing to the agility and flexibility imbibed in our workforce. Our skilled and highly passionate
                    team is
                    built to create excellent solutions that drive growth and innovation. Having in-depth knowledge and
                    extensive SaaS & Cloud Computing experience, we can implement custom Force.com solutions and map
                    legacy
                    systems of your organization to salesforce.com efficiently. With a sole focus on Salesforce & Cloud
                    Computing solutions combined with mobile, we aim to streamline your processes and workflow, thus
                    improving productivity & efficiency across the organization.</p>
            </div>
            <div class="image-content">
                <img src={aboutUsSecondImgUrl} alt="Team working on laptops">
            </div>
        </div>
        <button class="join-us-button" onclick={joinUs}>Join Us

                        <div class="sub-slide">

                                    <p>
                                        {slide.content}

                                </div>

                                    <img src={slide.imgUrl} alt="testimonial">
