<template>

    <template if:true={isLoading}>
        <div class="spinnerDiv">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <div class="main-div">
            <div class="overlay" lwc:dom="manual"></div>
            <div class="popup-for-confirmation">
                <template if:true={isModalOpen}>
                    <div class="custom_popup">
                        <div class="show-msg">{popupMessage}</div>
                        <div class="two-buttons">
                            <button class="ok-btn" onclick={closePopup}>Ok</button>
                        </div>
                    </div>
                </template>
                <template if:true={profilePreview}>
                    <div class="profile-preview-popup">
                        <div class="close-icon">
                            <lightning-icon icon-name="utility:close" alternative-text="Utility image" title="close" size="small" onclick={closePopup}></lightning-icon>
                        </div>
                        <img src={profileImage}></img>
                    </div>
                </template>
            </div>
            <div class="background-image">
                <img src={backgroundImageUrl} alt="Background Image" />
            </div>
            
            <div class="main-content">
                <div class="header">
                    <lightning-icon class="back-icon" size='x-small' icon-name="utility:chevronleft"
                        onclick={navigateHome}></lightning-icon>
                    <div class="header-title">{recordType} Details</div>
                </div>
                <div class="general-information">
                    <div class="profile-image">
                        <img src={profileImage} alt="Profile Image" onclick={previewProfileImage} />
                        <div class="delete-icon" onclick={removeProfile}>
                            <lightning-icon class="icon" icon-name="utility:delete" title="close"
                                size="x-small"></lightning-icon>
                        </div>
                        <button class="upload-button" onclick={uploadProfileImage}>Upload Image</button>
                        <input type="file" class="hidden-upload" accept=".jpg,.jpeg,.png" onchange={handleFileChange} />
                    </div>

                    <div class="general-info-content">
                        <div class="section-title">General Information</div>
                        <div class="form-group  first-row ">
                            <div class="form-element dropdownfield">
                                <p class="label">Salutation</p>
                                <select name="Salutation" class="input-dropdown" onchange={updateContact}
                                    disabled={isDisabled}>
                                    <template if:true={isDisabled}>
                                        <option value={contact.Salutation}>{contact.salutation}</option>
                                    </template>
                                    <template for:each={Salutationoptions} for:item="type">
                                        <option value={type.label} key={type.label}>{type.label}</option>
                                    </template>
                                </select>
                            </div>
                            <div class="form-element namefield">
                                <p class="label">First Name</p>
                                <input type="text" name="firstName" data-errmsg="Name should contain 2-50 character." pattern="[A-Za-z\s]{2,50}" class="input-text" value={contact.firstName}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                            <div class="form-element namefield">
                                <p class="label">Last Name</p>
                                <input type="text" name="lastName" data-errmsg="Name should contain 2-50 character." pattern="[A-Za-z\s]{2,50}" class="input-text" value={contact.lastName}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                        </div>
                        <div class="form-group ">
                            <div class="form-element">
                                <div class="gender-options">
                                    <div class="label">Gender</div>
                                    <div class="checkbox">
                                        <div class="tickbox checkbox1">
                                            <input class="Male" type="radio" name="gender" value="Male"
                                                onchange={updateContact} disabled={isDisabled}><span> Male</span></input>
                                        </div>
                                        <div class="tickbox checkbox1 ">
                                            <input class="Female" type="radio" name="gender" value="Female"
                                                onchange={updateContact} disabled={isDisabled}><span> Female</span></input>
                                        </div>
                                        <div class="tickbox checkbox1 ">
                                            <input class="Other" type="radio" name="gender" value="Other"
                                                onchange={updateContact} disabled={isDisabled}><span> Other</span></input>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group ">
                            <div class="date-and-age">
                                <div class="form-element date-first-half">
                                    <p class="label">Date of Birth</p>
                                    <input type="date" name="birthdate" class="input-text otherinput"
                                        value={contact.birthdate} onchange={updateContact}
                                        disabled={isDisabled} required></input>
                                </div>
                                <template if:true={isDisabled}>
                                    <div class="form-element date-second-half">
                                        <p class="label">Age</p>
                                        <input type="number" name="Birthdate" class="input-text otherinput" min="12"
                                            value={contact.age} onchange={updateContact}
                                            disabled={isDisabled}></input>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="other-details">
                    <div class="form-group ">
                        <div class="phone-and-email">
                            <div class="form-element input-first-half">
                                <p class="label">Mobile Number</p>
                                <input type="tel" name="phone" data-errmsg="Enter Valid Mobile Number." class="input-text" pattern="\d{10}" value={contact.phone}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                            <div class="form-element input-second-half">
                                <p class="label">Email</p>
                                <input type="email" name="email" data-errmsg="Enter Valid Email." class="input-text" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" value={contact.email}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="address-info">
                    <div class="section-title">Address Details</div>
                    <div class="form-group ">
                        <div class="address-line">
                            <p class="label">Address Line</p>
                            <input type="text" name="mailingStreet" class="input-text longfield"
                                value={contact.mailingStreet} onchange={updateContact} disabled={isDisabled}></input>
                        </div>
                    </div>
                    <div class="form-group ">
                        <div class="address-fields">
                            <div class="form-element input-first-half">
                                <p class="label">City</p>
                                <input type="text" name="mailingCity" class="input-text" value={contact.mailingCity}
                                    onchange={updateContact} disabled={isDisabled}></input>
                            </div>
                            <div class="form-element input-second-half">
                                <p class="label">PIN Code</p>
                                <input type="text" name="mailingPostalCode" data-errmsg="Must be 6 digits and doesn't start from zero." pattern="[1-9][0-9]{5}" class="input-text"
                                    value={contact.mailingPostalCode} onchange={updateContact}
                                    disabled={isDisabled}></input>
                            </div>
                        </div>
                    </div>
                    <div class="form-group ">
                        <div class="address-fields">
                            <div class="form-element input-first-half">
                                <p class="label">State</p>
                                <input type="text" name="mailingState" class="input-text" data-errmsg="State should contain 2-100 character." pattern="[A-Za-z\s]{2,100}" value={contact.mailingState}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                            <div class="form-element input-second-half">
                                <p class="label">Country</p>
                                <select name="mailingCountry" class="input-text country-dropdown" onchange={updateContact}
                                    disabled={isDisabled}>
                                    <template if:true={isDisabled}>
                                        <option value={contact.mailingCountry}>{contact.mailingCountry}</option>
                                    </template>
                                    <template for:each={countryOptions} for:item="type">
                                        <option value={type.label} key={type.value}>{type.label}</option>
                                    </template>
                                </select>
                                <!-- <input type="text" name="mailingCountry" class="input-text"
                                    value={contact.mailingCountry} onchange={updateContact}
                                    disabled={isDisabled}></input> -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="about-info">
                    <div class="section-title">About</div>
                    <div class="form-group ">
                        <div class="address-line">
                            <p class="label">Description</p>
                            <textarea name="description" maxlength="1000" class="input-text longfield decriptionfield" onchange={updateContact}
                                disabled={isDisabled}>{contact.description}</textarea>
                        </div>
                    </div>
                </div>
                <br />
                <div class="buttons">
                    <template if:true={isDisabled}>
                        <button class="btn slds-m-right_medium" onclick={getContactInfo}>Edit</button>
                    </template>
                    <template if:false={isDisabled}>
                        <button class="btn slds-m-right_medium" onclick={cancelAction}>Cancel</button>
                    </template>
                    <button class="save-btn slds-m-left_medium" onclick={updateContactInfo}
                        disabled={isDisabled}>Save</button>
                </div>
            </div>
        </div>
    </template>
</template>
