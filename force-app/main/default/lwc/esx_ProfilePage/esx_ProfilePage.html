<template>

    <template if:true={isLoading}>
        <div class="spinnerDiv">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <div class="mainDiv">
            <div class="backgroundImage">
                <img src={backgroundImageUrl} alt="Background Image" />
            </div>

            <div class="mainContent">
                <div class="header">
                    <lightning-icon class="backIcon" size='x-small' icon-name="utility:chevronleft"
                        onclick={navigateHome}></lightning-icon>
                    <div class="headerTitle">{recordType} Details</div>
                </div>
                <div class="generalInformation">
                    <div class="profileImage">
                        <img src={profileImage} alt="Profile Image" />
                        <div class="delete-icon" onclick={removeProfile}>
                            <lightning-icon class="icon" icon-name="utility:delete" title="close"
                                size="x-small"></lightning-icon>
                        </div>
                        <button class="uploadButton" onclick={uploadProfileImage}>Upload Image</button>
                        <input type="file" class="hidden-upload" accept=".jpg,.jpeg,.png" onchange={handleFileChange} />
                    </div>

                    <div class="generalInfoContent">
                        <div class="sectionTitle">General Information</div>
                        <div class="formGroup firstRow">
                            <div class="formElement dropdownfield">
                                <p class="label">Salutation</p>
                                <select name="Salutation" class="input-dropdown otherinput" onchange={updateContact}
                                    disabled={isDisabled}>
                                    <template if:true={isDisabled}>
                                        <option value={contact.Salutation}>{contact.Salutation}</option>
                                    </template>
                                    <template for:each={Salutationoptions} for:item="type">
                                        <option value={type.label} key={type.label}>{type.label}</option>
                                    </template>
                                </select>
                            </div>
                            <div class="formElement namefield">
                                <p class="label">First Name</p>
                                <input type="text" name="FirstName" class="input-text" value={contact.FirstName}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                            <div class="formElement namefield">
                                <p class="label">Last Name</p>
                                <input type="text" name="LastName" class="input-text" value={contact.LastName}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                        </div>
                        <div class="formGroup">
                            <div class="formElement">
                                <div class="gender-options">
                                    <div class="label">Gender</div>
                                    <div class="checkbox">
                                        <div class="tickbox checkbox1 slds-m-right_medium">
                                            <input class="Male" type="radio" name="Gender__c" value="Male"
                                                onchange={updateContact} disabled={isDisabled}><span> Male</span></input>
                                        </div>
                                        <div class="tickbox checkbox1 slds-m-left_medium">
                                            <input class="Female" type="radio" name="Gender__c" value="Female"
                                                onchange={updateContact} disabled={isDisabled}><span> Female</span></input>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="formGroup">
                            <div class="date-and-age">
                                <div class="formElement date-first-half">
                                    <p class="label">Date of Birth</p>
                                    <input type="date" name="Birthdate" class="input-text otherinput"
                                        value={contact.Birthdate} onchange={updateContact}
                                        disabled={isDisabled}></input>
                                </div>
                                <template if:true={isDisabled}>
                                    <div class="formElement date-second-half">
                                        <p class="label">Age</p>
                                        <input type="number" name="Birthdate" class="input-text otherinput" min="12"
                                            value={contact.Age__c} onchange={updateContact}
                                            disabled={isDisabled}></input>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="other-details">
                    <div class="formGroup">
                        <div class="phone-and-email">
                            <div class="formElement input-first-half">
                                <p class="label">Phone Number</p>
                                <input type="tel" name="Phone" class="input-text" value={contact.Phone}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                            <div class="formElement input-second-half">
                                <p class="label">Email</p>
                                <input type="email" name="Email" class="input-text" value={contact.Email}
                                    onchange={updateContact} disabled={isDisabled} required></input>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="address-info">
                    <div class="sectionTitle">Address Details</div>
                    <div class="formGroup">
                        <div class="address-line">
                            <p class="label">Address Line</p>
                            <input type="text" name="MailingStreet" class="input-text longfield"
                                value={contact.MailingStreet} onchange={updateContact} disabled={isDisabled}></input>
                        </div>
                    </div>
                    <div class="formGroup">
                        <div class="address-fields">
                            <div class="formElement input-first-half">
                                <p class="label">City</p>
                                <input type="text" name="MailingCity" class="input-text" value={contact.MailingCity}
                                    onchange={updateContact} disabled={isDisabled}></input>
                            </div>
                            <div class="formElement input-second-half">
                                <p class="label">PinCode</p>
                                <input type="text" name="MailingPostalCode" class="input-text"
                                    value={contact.MailingPostalCode} onchange={updateContact}
                                    disabled={isDisabled}></input>
                            </div>
                        </div>
                    </div>
                    <div class="formGroup">
                        <div class="address-fields">
                            <div class="formElement input-first-half">
                                <p class="label">State</p>
                                <input type="text" name="MailingState" class="input-text" value={contact.MailingState}
                                    onchange={updateContact} disabled={isDisabled}></input>
                            </div>
                            <div class="formElement input-second-half">
                                <p class="label">Country</p>
                                <input type="text" name="MailingCountry" class="input-text"
                                    value={contact.MailingCountry} onchange={updateContact}
                                    disabled={isDisabled}></input>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="about-info">
                    <div class="sectionTitle">About</div>
                    <div class="formGroup">
                        <div class="address-line">
                            <p class="label">Description</p>
                            <textarea name="Description" class="input-text longfield" onchange={updateContact}
                                disabled={isDisabled}>{contact.Description}</textarea>
                        </div>
                    </div>
                </div>
                <br />
                <div class="buttons">
                    <template if:true={isDisabled}>
                        <button class="btn slds-m-right_medium" onclick={getContactInfo}>Edit</button>
                    </template>
                    <template if:false={isDisabled}>
                        <button class="btn slds-m-right_medium" onclick={cancelAction}>Cancel</button>
                    </template>
                    <button class="save-btn slds-m-left_medium" onclick={updateContactInfo}
                        disabled={isDisabled}>Save</button>
                </div>
            </div>
        </div>
    </template>
</template>
