<template>

    <template if:true={isLoading}>
        <div class="spinnerDiv">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <div class="mainDiv">
            <div class="backgroundImage">
                <img src={backgroundImageUrl} alt="Background Image" />
            </div>

            <div class="mainContent">
                <div class="header">
                    <lightning-icon class="backIcon" size='x-small' icon-name="utility:chevronleft"
                        onclick={navigateHome}></lightning-icon>
                    <div class="headerTitle">{recordType} Details</div>
                </div>
                <div class="generalInformation">
                    <div class="profileImage">
                        <img src={profileImage} alt="Profile Image" />
                        <button class="uploadButton" onclick={uploadProfileImage}>Upload Image</button>
                        <input type="file" class="hidden-upload" accept=".jpg,.jpeg,.png" onchange={handleFileChange} />
                    </div>

                    <div class="generalInfoContent">
                        <div class="sectionTitle">General Information</div>
                        <div class="formGroup firstRow">
                            <div class="formElement">
                                <div class="label">Salutation</div>
                                <lightning-combobox variant="label-hidden" disabled={isDisabled} name="Salutation"
                                    value={contact.Salutation} placeholder="Salutation" options={Salutationoptions}
                                    onchange={updateContact}></lightning-combobox>
                            </div>
                            <div class="formElement firstName">
                                <div class="label">First Name</div>
                                <lightning-input class="inputBox" variant="label-hidden" disabled={isDisabled}
                                    type="text" name="FirstName" value={contact.FirstName}
                                    onchange={updateContact}></lightning-input>
                            </div>
                            <div class="formElement">
                                <div class="label">Last Name</div>
                                <lightning-input class="inputBox" variant="label-hidden" disabled={isDisabled}
                                    type="text" name="LastName" value={contact.LastName}
                                    onchange={updateContact}></lightning-input>
                            </div>
                        </div>
                        <div class="formGroup">
                            <!-- Give 2 radio button for gender -->
                            <div class="formElement">
                                <div class="label">Gender</div>
                                <lightning-radio-group class="genderOptions" variant="label-hidden"
                                    disabled={isDisabled} onchange={updateContact} name="Gender__c" label="Gender"
                                    options={genderOptions} value={contact.Gender__c}>
                                </lightning-radio-group>
                            </div>
                        </div>
                        <div class="formGroup">
                            <div class="date-and-age slds-m-right_medium">
                                <div class="formElement">
                                    <div class="label">Date of Birth</div>
                                    <lightning-input type="date" name="Birthdate" value={contact.Birthdate}
                                        variant="label-hidden" disabled={isDisabled}
                                        onchange={updateContact}></lightning-input>
                                </div>
                                <template if:true={isDisabled}>
                                    <div class="formElement slds-m-left_medium">
                                        <div class="label">Age</div>
                                        <lightning-input class=" input-age" variant="label-hidden" disabled={isDisabled}
                                            type="number" min="12" name="Age__c" value={contact.Age__c}
                                            onchange={updateContact}></lightning-input>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="other-details">
                    <div class="formGroup">
                        <div class="phone-and-email">
                            <div class="formElement input-half slds-m-right_medium">
                                <div class="label">Phone Number</div>
                                <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled}
                                    type="tel" name="Phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" value={contact.Phone}
                                    onchange={updateContact}></lightning-input>
                            </div>
                            <div class="formElement input-half slds-m-left_medium">
                                <div class="label">Email</div>
                                <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled}
                                    type="email" name="Email" value={contact.Email}
                                    onchange={updateContact}></lightning-input>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="address-info">
                    <div class="sectionTitle">Address Details</div>
                    <div class="formGroup">
                        <div class="address-line">
                            <div class="label">Address Line</div>
                            <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled} type="text"
                                name="MailingStreet" value={contact.MailingStreet} onchange={updateContact}></lightning-input>
                        </div>
                    </div>
                    <div class="formGroup">
                        <div class="address-fields">
                            <div class="formElement input-half slds-m-right_medium">
                                <div class="label">City</div>
                                <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled}
                                    type="text" name="MailingCity" value={contact.MailingCity}
                                    onchange={updateContact}></lightning-input>
                            </div>
                            <div class="formElement input-half slds-m-left_medium">
                                <div class="label">PinCode</div>
                                <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled}
                                    type="number" name="MailingPostalCode" value={contact.MailingPostalCode}
                                    onchange={updateContact}></lightning-input>
                            </div>
                        </div>
                    </div>
                    <div class="formGroup">
                        <div class="address-fields">
                            <div class="formElement input-half slds-m-right_medium">
                                <div class="label">State</div>
                                <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled}
                                    type="text" name="MailingState" value={contact.MailingState}
                                    onchange={updateContact}></lightning-input>
                            </div>
                            <div class="formElement input-half slds-m-left_medium">
                                <div class="label">Country</div>
                                <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled}
                                    type="text" name="MailingCountry" value={contact.MailingCountry}
                                    onchange={updateContact}></lightning-input>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="about-info">
                    <div class="sectionTitle">About</div>
                    <div class="formGroup">
                        <div class="address-line">
                            <div class="label">Description</div>
                            <lightning-input class="inputfield" variant="label-hidden" disabled={isDisabled}
                                type="textarea" name="Description" value={contact.Description}
                                onchange={updateContact}></lightning-input>
                        </div>
                    </div>
                </div>
                <br />
                <div class="buttons">
                    <button class="btn slds-m-right_medium" onclick={getContactInfo}>Edit</button>
                    <button class="save-btn slds-m-left_medium" onclick={updateContactInfo}
                        disabled={isDisabled}>Save</button>
                </div>
            </div>
        </div>
    </template>
</template>
