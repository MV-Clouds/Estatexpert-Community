<template>
    <div class="container">
        <div class="box">

            <!-- <div if:true={isVisible}>
                <div class="toast">
                    <span>{message}</span>
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                </div>
            </div> -->

            <div class="headers mb-10">
                <h3 class="header">Change Your Password</h3>
            </div>

            <p class="line mb-10"></p>

            <div class="input-fields mt-30 mb-30">
                <div class="input-field mb-20">
                    <label for="old_password" class="mb-5">Old Password<span class="astrick"> *</span></label>
                    <input type="password" placeholder="Enter your old password" class="input-tag" data-id="oldPassword"
                        oninput={handleInputChange} autocomplete="off" />
                    <div class="line-height">
                        <span class="error-cls" data-error="oldPassword"></span>
                    </div>
                </div>

                <div class="input-field mb-20">
                    <label for="new_password" class="mb-5">New Password<span class="astrick"> *</span></label>
                    <input type="password" placeholder="Enter new password" class="input-tag" data-id="newPassword"
                        oninput={handleInputChange} autocomplete="off" />
                    <div class="line-height">
                        <span class="error-cls" data-error="newPassword"></span>
                    </div>
                </div>

                <div class="input-field">
                    <label for="old_password" class="mb-5">Confirm Password<span class="astrick"> *</span></label>
                    <input type="password" placeholder="Confirm Password" class="input-tag" data-id="confirmPassword"
                        oninput={handleInputChange} autocomplete="off" />
                    <div class="line-height">
                        <span class="error-cls" data-error="confirmPassword"></span>
                    </div>
                </div>

                <div class="password-pattern">
                    <!-- <p> <lightning-icon icon-name="action:check" size="xx-small" class={legthClass} ></lightning-icon> Password should be greater then 8.</p>
                    <p> <lightning-icon icon-name="action:check" size="xx-small" class={digitClass} ></lightning-icon> Minimum 1 digit in password.</p>
                    <p> <lightning-icon icon-name="action:check" size="xx-small" class={capitalCaseClass} ></lightning-icon> Minimum 1 capitalcase latter in password.</p>
                    <p> <lightning-icon icon-name="action:check" size="xx-small" class={lowerCaseClass} ></lightning-icon> Minimum 1 lowercase latter in password.</p>
                    <p> <i class="fa-solid fa-circle-check"></i> <lightning-icon icon-name="action:check" size="xx-small" class={specialCharClass} ></lightning-icon> Minimum 1 special character in password like @#$.</p> -->
                    
                    <p class="mt-3"> <i class={legthClass}>&#x2713;  </i> Password should be greater then 8.</p>
                    <p class="mt-3"> <i class={digitClass}>&#x2713;  </i> Minimum 1 digit in password.</p>
                    <p class="mt-3"> <i class={capitalCaseClass}>&#x2713;  </i> Minimum 1 capitalcase latter in password.</p>
                    <p class="mt-3"> <i class={lowerCaseClass}>&#x2713;  </i> Minimum 1 lowercase latter in password.</p>
                    <p class="mt-3"> <i class={specialCharClass}>&#x2713;  </i> Minimum 1 special character in password like @#$.</p>
                
                </div>

            </div>

            <div class="btn">
                <button class="btn-tag" onclick={handleSetPassword}>Set Password</button>
            </div>

        </div>
    </div>
</template>
