    <!-- modal start -->
    <template if:true={isShowModal}>

            <div class="slds-modal__container">

                            title="Close" onclick={hideModalBox}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </div>


                    <div class="main-model">
                        <div class="bed-bath">
                            <div class="bedromm-pop">
                                <label>Bedroom</label>
                                <div class="backcolor bedroom-pop">
                                    <span data-name="room-filter-input" onclick={decreaseHandle}>-</span>
                                    <span>{roomNumberFilterInput}</span>
                                    <span data-name="room-filter-input" onclick={increaseHandle}>+</span>
                                </div>
                            </div>
                            <div class="bathromm-pop">
                                <label>Bathroom</label>
                                <div class="backcolor bathroom-pop">
                                    <span data-name="bathroom-filter-input" onclick={decreaseHandle}>-</span>
                                    <span>{bathRoomNumberFilterInput}</span>
                                    <span data-name="bathroom-filter-input" onclick={increaseHandle}>+</span>
                                </div>
                            </div>
                        </div>
                        <div class="listing-type">
                            <label for="">Listing type</label>
                            <div class="backcolor listing-sub">

                                    <option value="">-None-</option>
                                    <template for:each={listType} for:item="list" for:index="index">
                                        <option key={list.index} value={list.value}>{list.label}</option>
                                    </template>
                                </select>
                            </div>

                        </div>
                        <div class="max-min-price">
                            <div class="min-price-pop">
                                <label>Min Price</label>
                                <div class="backcolor min-pop">
                                    <span>Rs.</span>
                                    <input type="number" data-label="min-price" value={minPrice} placeholder="Min Price"
                                        min="0" onkeypress={handleKeyPress} onchange={handleInputChange}>
                                </div>
                            </div>
                            <div class="max-price-pop">
                                <label>Max Price</label>
                                <div class="backcolor max-pop">
                                    <span>Rs.</span>
                                    <input type="number" data-label="max-price" value={maxPrice} placeholder="Max Price"
                                        min="0" onkeypress={handleKeyPress} onchange={handleInputChange}>
                                </div>
                            </div>
                        </div>
                        <div class="square-footage">
                            <label for="">Square Footage &nbsp;(<span>m<sup>2</sup></span>)</label>
                            <div class="backcolor square-sub">
                                <div class="input-squr">

                                </div>
