<template>

        <div class="overlay">
            <div class="close-icon">
                <lightning-icon icon-name="utility:close" alternative-text="Utility image" title="close" size="small"

            </div>
        </div>

        <div class="image-viewer">
            <template if:true={isModalOpen}>
                <!-- <div class="img-viewer-popup">
                    <div class="close-icon">
                        <lightning-icon icon-name="utility:close" alternative-text="Utility image" title="close"
                            size="small" onclick={closePopup}></lightning-icon>
                    </div>
                    <img src={propertyImage}></img>
                </div> -->
                <div class="td-txt photo-cell ph-hg-at">
                    <div class="main-file-cmp">
                        <template for:each={propertyMediaImages} for:item="cd" for:index="indexNum">

                                data-cdid={cd.ExternalLink__c} data-cid={cd.ExternalLink__c} data-cdlindex={indexNum}>

                                    <!-- </div> -->
                                
                            <!-- </div> -->
                        </template>
                    </div>
                </div>
            </template>
        </div>
        <div class="container">
            <div class="content">
                <div class="title-box">
                    <h1 class="title">Living Room(<span class="number-of-imgs">{livingRoomImgsSize}</span>)</h1>
                </div>
                <div class="images-box">
                    <template for:each={livingRoomImgs} for:item="livingroom">
                        <div class="card" onclick={handleCard} key={livingroom.ExternalLink__c}
                            data-url={livingroom.ExternalLink__c}>
                            <div class="card-image">
                                <img draggable="false" src={livingroom.ExternalLink__c} class="responsive" alt="Images">
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            <div class="content">
