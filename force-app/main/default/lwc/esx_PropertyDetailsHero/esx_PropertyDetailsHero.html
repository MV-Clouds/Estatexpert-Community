<template>
    <div class="container">
        <div class="top-box">
            <div class="box1">
                <div class="property-image">
                    <img src={propertyMainImage}></img>
                </div>
            </div>
            <div class="box2">
                <template if:true={isProperty}>
                    <div class="property-brief-info">
                        <div class="title content">Featured Property</div>
                        <div class="name-and-agent content">
                            <div class="property-name">
                                <h1 class="prop-name">{property.Name}</h1>
                                <p class="grey-text">{property.Landmark__c}, {property.City__c}, {property.Country__c}
                                </p>
                            </div>
                            <div class="agent-details">
                                <lightning-avatar size="large" variant="circle" class="avatar slds-m-right_small"
                                    src={profileImage}></lightning-avatar>
                                <div class="agent-name">
                                    <p class="name">{property.Current_Owner__r.Name}</p>
                                    <p class="grey-text profession">{property.Current_Owner__r.RecordType.Name}</p>
                                </div>
                            </div>
                        </div>
                        <div class="number-details content">
                            <div class="bed number-box">
                                <img src={bedroomIcon} class="icons"></img>
                                <p class="number-text">{property.Number_of_Bedrooms__c} Beds</p>
                            </div>
                            <div class="bathrooms number-box">
                                <img src={bathroomIcon} class="icons"></img>
                                <p class="number-text">{property.Number_of_Bathrooms__c} Baths</p>

                            </div>
                            <div class="balconies number-box">
                                <img src={balconyIcon} class="icons"></img>
                                <p class="number-text">{property.Balconies__c} Balconies</p>
                            </div>
                            <div class="furnished-status number-box">
                                <img src={furnishedIcon} class="icons"></img>
                                <p class="number-text">{property.Furnished_Status__c}</p>
                            </div>
                        </div>
                        <div class="price content">
                            <div class="price-val">Rs. {property.Price__c}</div>
                        </div>
                        <div class="other-info content">
                            <div class="row-1">
                                <div class="info-1">
                                    <p class="grey-text column-name">Carpet Area</p>
                                    <p class="column-value">{property.Total_Carpet_Area__c}</p>
                                </div>
                                <div class="info-2">
                                    <p class="grey-text column-name">Transaction Type</p>
                                    <p class="column-value">{property.Transaction_Type__c}</p>
                                </div>
                                <div class="info-3">
                                    <p class="grey-text column-name">Status</p>
                                    <p class="column-value">{property.Possession_Status__c}</p>
                                </div>

                                <div class="info-1">
                                    <p class="grey-text column-name">Covered Area</p>
                                    <p class="column-value">{property.Total_Covered_Area__c}</p>
                                </div>
                                <div class="info-2">
                                    <p class="grey-text column-name">Parking</p>
                                    <p class="column-value">{property.Number_of_Parking__c}</p>
                                </div>
                                <div class="info-3">
                                    <p class="grey-text column-name">Floor No.</p>
                                    <p class="column-value">{property.Floor_No__c}</p>
                                </div>

                                <div class="info-1">
                                    <p class="grey-text column-name">Furnished Status</p>
                                    <p class="column-value">{property.Furnished_Status__c}</p>
                                </div>
                                <div class="info-2">
                                    <p class="grey-text column-name">Type Of Ownership</p>
                                    <p class="column-value">Freehold</p>
                                </div>

                                <div class="info-3">
                                    <p class="grey-text column-name">Age Of Construction</p>
                                    <p class="column-value">{property.Age_Of_Construction__c} Years</p>
                                </div>
                            </div>
                            <!-- <div class="row-2">
                                <div class="info-1">
                                    <p class="grey-text column-name">Additional Rooms</p>
                                    <p class="column-value">1 Store Room</p>
                                </div>
                                <div class="info-2">
                                    <p class="grey-text column-name">Facing</p>
                                    <p class="column-value">North-East</p>
                                </div>
                                <div class="info-3">
                                    <p class="grey-text column-name">Lift</p>
                                    <p class="column-value">1</p>
                                </div>
                            </div>
                            <div class="row-3">
                                <div class="info-1">
                                    <p class="grey-text column-name">Furnished Status</p>
                                    <p class="column-value">{property.Furnished_Status__c}</p>
                                </div>
                                <div class="info-2">
                                    <p class="grey-text column-name">Type Of Ownership</p>
                                    <p class="column-value">Freehold</p>
                                </div>
                            </div>
                            <div class="row-4">
                                <div>
                                    <p class="grey-text column-name">Age Of Construction</p>
                                    <p class="column-value">{property.Age_Of_Construction__c} Years</p>
                                </div>
                            </div> -->
                        </div>
                        <div class="buttons">
                            <button class="btn" onclick={updateContactInfo}>Contact Owner</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
        <div class="bottom-box">
            <div class="images">
                <div class="scroll">
                    <!-- <lightning-button-icon icon-name="utility:chevronleft" size="large" variant="bare" onclick={goToPrevious}
                                class="arrow left-arrow" disabled={left_arrow_disabled}></lightning-button-icon> -->
                    <template for:each={propertyMedias} for:item="media">
                        <div class="card" key={media.ExternalLink__c}>
                            <div class="card-image">
                                <img draggable="false" src={media.ExternalLink__c} class="responsive" alt="Images">
                            </div>
                            <div class="black" data-id={media.Id} onclick={showMoreImages}>
                                <p>+{moreImgSize}</p>
                            </div>
                        </div>
                    </template>
                    <!-- <lightning-button-icon icon-name="utility:chevronright" size="large" variant="bare" onclick={goToPrevious}
                                class="arrow left-arrow" disabled={left_arrow_disabled}></lightning-button-icon> -->
                </div>
            </div>
        </div>
    </div>
</template>
