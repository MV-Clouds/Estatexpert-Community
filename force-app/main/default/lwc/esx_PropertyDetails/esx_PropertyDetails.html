<template>
    <div class="main-div">
        <div class="header">
            <img src={backIcon} onclick={navigateHome}>
        </div>
        
        <div class="property-brief">
            <c-esx_-property-details-hero propertyid={propertyId}></c-esx_-property-details-hero>
        </div>

        <div class="navigation">
            <div class="nav-bar">
                <div class="description" data-name="description" onclick={handleNavigation}>Description</div>
                <div class="gallary" data-name="gallary" onclick={handleNavigation}>Gallary</div>
            </div>
        </div>

        <div class="content">
            <template if:true={isDescription}>
                <div class="description-content">
                    <c-esx_-property-info propertyid={propertyId}></c-esx_-property-info>
                </div>
            </template>
            <template if:true={isGallary}>
                <div class="gallary-content">
                    <c-esx_-property-gallary propertyid={propertyId}></c-esx_-property-gallary>
                </div>
            </template>
        </div>
    </div>
</template>
