<template>
    <div class="main-container">

        <template if:true={isLoading}>
            <div class="slds-spinner_container" style="position:fixed;opacity:1;">
                <div class="slds-spinner--brand  slds-spinner slds-spinner--large slds-is-relative" role="alert">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                    <div class="custom-loading-text"></div>
                </div>
            </div>
            <div class="slds-backdrop slds-backdrop_open" style="opacity: 0.5;"></div>
        </template>

        <c-esx_custom-toast-component show-toast={showToast} type={toastType} message={toastMessage} onclosetoast={closeToast}></c-esx_custom-toast-component>

        <div class="left-side">
            <img src={sideImgURL} alt="Login Hero Image">
        </div>
        <div class="login-modal">

            <template if:true={isForgotPassPage}>
                <div class="header-span">Forgot Password</div>
                
                <div class="username-input">
                    <div class="input-label">Username</div>
                    <input type="text" class="login-input" id="userName" name="userName" placeholder="Username or Email" value={userName} oninput={handleChange}>
                </div>

                <template if:true={badCredMessage}>
                    <div class="error-message">{badCredMessage}</div>
                </template>
    
                <div class="footer">
                    <div class="login-btn" onclick={handleSubmit}>Submit</div>
                </div>
            </template>

            <!-- Verify OTP page starts -->
            <template if:true={isVerifyPassPage}>
                <div class="header-span">Verify Code</div>
                <div class="header-desc">Enter 6 digit Verification Code sent on {userName}</div>

                <div class="otp-input-container">
                    <input type="text" class="otp-input" id="otp1" name="otp1" maxlength="1" pattern="[0-9]" value={otpInput1Value} autocomplete="off" onkeyup={handleOtpKeyUp}>
                    <input type="text" class="otp-input" id="otp2" name="otp2" maxlength="1" pattern="[0-9]" value={otpInput2Value} autocomplete="off" onkeyup={handleOtpKeyUp}>
                    <input type="text" class="otp-input" id="otp3" name="otp3" maxlength="1" pattern="[0-9]" value={otpInput3Value} autocomplete="off" onkeyup={handleOtpKeyUp}>
                    <input type="text" class="otp-input" id="otp4" name="otp4" maxlength="1" pattern="[0-9]" value={otpInput4Value} autocomplete="off" onkeyup={handleOtpKeyUp}>
                    <input type="text" class="otp-input" id="otp5" name="otp5" maxlength="1" pattern="[0-9]" value={otpInput5Value} autocomplete="off" onkeyup={handleOtpKeyUp}>
                    <input type="text" class="otp-input" id="otp6" name="otp6" maxlength="1" pattern="[0-9]" value={otpInput6Value} autocomplete="off" onkeyup={handleOtpKeyUp}>
                </div>

                <div class="resend-code">Didn't receive code? &nbsp;<div class="resend-code-href" onclick={resendOTP}>Resend Code</div></div>

                <template if:true={otpValidationMessage}>
                    <div class="error-message">{otpValidationMessage}</div>
                </template>

                <div class="footer">
                    <div class="login-btn" onclick={hanldeVerifyOTP}>Continue</div>
                </div>

            </template>
            <!-- Verify OTP page ends -->

            <!-- ResetPassword Page Starts-->

            <template if:true={isResetPassPage}>
                <div class="header-span">Reset Password</div>
                
                <div class="username-input">
                    <div class="input-label">Password</div>
                    <input type="password" class="login-input" id="password" name="password" placeholder="Password" value={password} onchange={handlePassChange}>
                </div>
    
                <div class="username-input">
                    <div class="input-label">Confirm Password</div>
                    <input type="password" class="login-input" id="confPassword" name="confPassword" placeholder="Confirm Password" value={confPassword} onchange={handlePassChange}>
                </div>

                <template if:true={passNotMatchMessage}>
                    <div class="error-message">{passNotMatchMessage}</div>
                </template>

                <div class="footer">
                    <div class="login-btn" onclick={hanldeResetPass}>Reset Password</div>
                </div>

            </template>

            <!-- ResetPassword Page Ends-->


            <div class="back-login-container">
                <div class="back-login-href" onclick={handleBackLogin}>Return to login</div>
            </div>

        </div>
    </div>
</template>
